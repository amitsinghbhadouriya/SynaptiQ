[server]
maxUploadSize = 20
maxMessageSize = 200
runOnSave = false
# The file watcher inspects every imported module; with transformers loaded that is slow and
# floods the log with optional-dependency tracebacks. Restart the app after editing code instead.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f2f3f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#15171c"
font = "sans serif"
